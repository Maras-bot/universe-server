# Backstop: un push fatto con --no-verify viene comunque fermato in CI.
# Action leggera, adatta al piano gratuito dei repo privati (minuti mensili).
name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan for secrets
        run: python3 scripts/secret_scan.py --ci
